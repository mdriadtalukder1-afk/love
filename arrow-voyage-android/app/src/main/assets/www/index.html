<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1f">
<style>
@font-face { font-family: "Sora"; src: url("fonts/Sora.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
@font-face { font-family: "Manrope"; src: url("fonts/Manrope.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
</style>
<title>Arrow Voyage</title>
<style>
/* Layout: one-screen app. Home = hero orb, two mode tiles, gallery strip, level path, Play. Game = glass HUD (back, level + progress, energy cells, restart), full-height board, glass dock (levels, zoom, hint). */
:root {
  --bg: #0b0f1f; --bg2: #141a33; --glass: rgba(255, 255, 255, .07); --glass2: rgba(255, 255, 255, .12); --line: rgba(255, 255, 255, .14);
  --ink: #eef1ff; --muted: #8b93b8; --accent: #35e0c4; --accent2: #8c6cff; --accent-ink: #051410;
  --gold: #ffcf5a; --glow: #ffe28a; --bad: #ff5c7a; --sil: rgba(255, 255, 255, .055); --sil-line: rgba(255, 255, 255, .0);
  --arrow: #e9edff; --a1: #35e0c4; --a2: #8c6cff; --a3: #ff6ec7; --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  --display: "Sora", "Manrope", system-ui, sans-serif; --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: dark;
}
:root[data-skin="dusk"] {
  --bg: #170c24; --bg2: #2a1340; --accent: #ff8a5c; --accent2: #c94bff; --accent-ink: #1d0a05; --a1: #ff8a5c; --a2: #c94bff; --a3: #ffd166; --muted: #a58bb8;
}
:root[data-skin="mint"] {
  --bg: #eef4f6; --bg2: #d9e7ec; --glass: rgba(255, 255, 255, .62); --glass2: rgba(255, 255, 255, .85); --line: rgba(20, 40, 60, .1);
  --ink: #0f1b2d; --muted: #5f6f86; --accent: #0fa58a; --accent2: #5b5bff; --accent-ink: #f2fffb; --gold: #f3b53a; --glow: #ffd97a; --bad: #e8445f;
  --sil: rgba(15, 27, 45, .06); --arrow: #152238; --a1: #0fa58a; --a2: #5b5bff; --a3: #ff4fa3; --shadow: 0 14px 40px rgba(15, 27, 45, .14); color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-skin]) { color-scheme: dark; }
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overflow: hidden; transition: background .3s;
}
/* aurora: two drifting color fields plus a faint dot grid so the dark isn't flat */
body::before {
  content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
  background: radial-gradient(40% 35% at 20% 20%, color-mix(in srgb, var(--a2) 45%, transparent), transparent 70%),
    radial-gradient(45% 40% at 85% 30%, color-mix(in srgb, var(--a1) 35%, transparent), transparent 70%),
    radial-gradient(40% 40% at 60% 95%, color-mix(in srgb, var(--a3) 30%, transparent), transparent 70%);
  filter: blur(30px); animation: drift 18s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate(4%, -3%) rotate(3deg) scale(1.08); } }
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.5px) 0 0 / 22px 22px,
    linear-gradient(180deg, transparent 60%, color-mix(in srgb, var(--bg) 70%, transparent));
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 14px; }
.app {
  position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; max-width: 620px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
}
.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; position: relative; flex: none; color: var(--ink); }
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon:active { transform: scale(.92); }

/* ---------- home ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill svg { width: 18px; height: 18px; fill: var(--gold); }
.hero { display: grid; justify-items: center; padding: 18px 0 8px; text-align: center; }
.orb { width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent) 40%, var(--accent2) 100%);
  box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 12%, transparent), 0 20px 50px color-mix(in srgb, var(--accent2) 45%, transparent); animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.orb svg { width: 64px; height: 64px; }
.hero h1 { margin: 18px 0 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 8.5vw, 42px); letter-spacing: -1px; line-height: 1; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 8px 0 0; color: var(--muted); font-weight: 700; font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.tile { border-radius: 22px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-height: 140px; position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%); pointer-events: none; }
.tile.alt::before { background: linear-gradient(135deg, color-mix(in srgb, var(--accent2) 26%, transparent), transparent 60%); }
.tile b { font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.15; }
.tile span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.tile .art { flex: 1; display: flex; align-items: flex-end; justify-content: flex-end; }
.tile .art svg { width: 44px; height: 44px; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tile.alt .art svg { stroke: var(--accent2); }
.tile .go { position: absolute; left: 16px; bottom: 14px; font-weight: 800; font-size: 13px; color: var(--accent); }
.tile.alt .go { color: var(--accent2); }
.tile.done .go { color: var(--muted); }
.gallery { margin-top: 12px; border-radius: 20px; padding: 12px 14px; }
.gallery .gh { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--muted); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
.gallery .gh button { color: var(--accent); font-weight: 800; letter-spacing: 0; text-transform: none; font-size: 13px; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.thumb { flex: none; width: 58px; height: 68px; border-radius: 14px; background: var(--glass2); border: 1px solid var(--line); display: grid; place-items: center; position: relative; }
.thumb svg { width: 44px; height: 54px; }
.thumb.locked svg { opacity: .14; }
.thumb .q { position: absolute; font-family: var(--display); font-size: 20px; color: var(--muted); font-weight: 700; }
.spacer { flex: 1; min-height: 8px; }
.path { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 0 16px; position: relative; }
.path::before { content: ""; position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; margin-top: -1px; background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent); }
.node {
  position: relative; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-family: var(--display);
  background: var(--glass2); border: 1px solid var(--line); color: var(--ink); font-weight: 700; font-size: 15px; backdrop-filter: blur(10px);
}
.node.boss { border-color: var(--bad); color: var(--bad); }
.node.cur { width: 56px; height: 56px; font-size: 20px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); border: 0; box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 45%, transparent); }
.node.done { opacity: .5; }
.node.locked { opacity: .35; }
.play {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); border-radius: 20px; padding: 14px 0 12px;
  display: grid; justify-items: center; line-height: 1.15; box-shadow: 0 14px 40px color-mix(in srgb, var(--accent2) 45%, transparent); margin-bottom: 4px; position: relative; overflow: hidden;
}
.play::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .35) 50%, transparent 70%); transform: translateX(-120%); animation: shine 4s ease-in-out infinite; }
@keyframes shine { 30%, 100% { transform: translateX(120%); } }
.play b { font-family: var(--display); font-size: 24px; font-weight: 800; letter-spacing: 1px; }
.play span { font-size: 13px; opacity: .8; font-weight: 800; }
.play:active { transform: scale(.985); }

/* ---------- game ---------- */
.hud { display: flex; align-items: center; gap: 6px; border-radius: 20px; padding: 6px; }
.hud .mid { flex: 1; min-width: 0; display: grid; gap: 5px; padding: 0 4px; }
.hud .title { font-family: var(--display); font-weight: 700; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; white-space: nowrap; min-width: 0; }
.hud .title span { overflow: hidden; text-overflow: ellipsis; }
.hud .title small { font-family: var(--font); font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .35s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 0 10px var(--accent); }
.cells { display: flex; gap: 5px; padding: 0 6px; }
.cells i { display: block; width: 12px; height: 26px; border-radius: 6px; background: linear-gradient(180deg, var(--accent), var(--accent2)); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); transition: opacity .3s, transform .3s; }
.cells i.gone { opacity: .18; box-shadow: none; background: var(--muted); }
.cells i.pop { animation: cellIn .45s cubic-bezier(.2, .9, .3, 1.5) both; }
.cells i.fall { animation: cellOut .55s ease-in forwards; }
@keyframes cellIn { from { transform: scaleY(0); } }
@keyframes cellOut { 30% { transform: scale(1.3); background: var(--bad); box-shadow: 0 0 16px var(--bad); } to { transform: scale(.4); opacity: .18; } }
.stage { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; margin: 8px 0; }
.zoom { position: absolute; inset: 0; display: grid; place-items: center; transform-origin: 0 0; }
.board { position: relative; transform-origin: 50% 50%; }
.board.shake { animation: shake .28s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.board svg, .board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.board canvas { pointer-events: none; }
.sil rect { fill: var(--sil); transition: fill .6s; }
.sil.reveal rect { fill: color-mix(in srgb, var(--gold) 70%, var(--bg)); }
.sn path { fill: none; stroke: var(--arrow); stroke-linecap: butt; stroke-linejoin: miter; stroke-width: var(--sw, 1.6); }
.sn polygon { fill: var(--arrow); }
.sn.fly path { stroke: var(--gold); } .sn.fly polygon { fill: var(--gold); }
.sn.fly { filter: drop-shadow(0 0 2px var(--glow)) drop-shadow(0 0 6px var(--glow)); }
.sn.bad path { stroke: var(--bad); } .sn.bad polygon { fill: var(--bad); }
.sn.hint path { stroke: var(--accent); animation: blink .7s ease-in-out infinite; } .sn.hint polygon { fill: var(--accent); }
.sn.hint { filter: drop-shadow(0 0 4px var(--accent)); }
@keyframes blink { 50% { opacity: .35; } }
.banner {
  position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none;
  border-radius: 18px; padding: 12px 24px; text-align: center; line-height: 1.25; box-shadow: var(--shadow); font-size: 15px; white-space: nowrap; font-weight: 800; color: var(--muted);
}
.banner b { display: block; color: var(--ink); font-family: var(--display); font-size: 22px; font-weight: 800; }
.combo { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); font-family: var(--display); font-weight: 800; color: var(--gold); font-size: 22px; pointer-events: none; opacity: 0; z-index: 5; text-shadow: 0 0 14px var(--glow); }
.dock { display: flex; justify-content: space-between; align-items: center; border-radius: 22px; padding: 6px; gap: 4px; }
.dock button { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; color: var(--ink); position: relative; }
.dock button:active { transform: scale(.9); }
.dock .zoomgrp { display: flex; align-items: center; gap: 2px; border-radius: 16px; background: var(--glass); }
.dock .zoomgrp button { width: 46px; }
.dock .zl { font-size: 11px; font-weight: 800; color: var(--muted); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.dock svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dock .hint { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent); }
.dock .badge { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 800; line-height: 22px; text-align: center; }

/* ---------- overlay ---------- */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; z-index: 20; background: color-mix(in srgb, var(--bg) 65%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.sheet {
  width: min(380px, 100%); background: color-mix(in srgb, var(--bg2) 92%, #fff); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow);
  padding: 24px 20px; text-align: center; display: grid; gap: 12px; animation: rise .4s cubic-bezier(.2, .9, .3, 1.25); max-height: calc(100% - 20px);
}
@keyframes rise { from { transform: translateY(30px) scale(.92); opacity: 0; } }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px; }
.sheet p { margin: 0; color: var(--muted); font-weight: 700; font-size: 14px; }
.stars { display: flex; justify-content: center; align-items: flex-end; gap: 6px; height: 72px; }
.stars svg { width: 50px; height: 50px; fill: var(--line); }
.stars svg:nth-child(2) { width: 66px; height: 66px; margin-bottom: 8px; }
.stars svg.on { fill: var(--gold); animation: pop .5s cubic-bezier(.2, .9, .3, 1.6) both; filter: drop-shadow(0 0 10px var(--glow)); }
.stars svg.on:nth-child(2) { animation-delay: .18s; } .stars svg.on:nth-child(3) { animation-delay: .36s; }
@keyframes pop { from { transform: scale(0) rotate(-60deg); } }
.pic { display: grid; place-items: center; }
.pic svg { width: 100px; height: 120px; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--gold) 60%, transparent)); }
.row { display: flex; gap: 10px; }
.btn { flex: 1; border-radius: 16px; padding: 13px 0; font-weight: 800; font-size: 16px; background: var(--glass2); border: 1px solid var(--line); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); border: 0; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 46vh; overflow-y: auto; padding: 4px; }
.grid button { aspect-ratio: 1; border-radius: 14px; background: var(--glass2); border: 1px solid var(--line); font-family: var(--display); font-weight: 700; font-size: 15px; }
.grid button.boss { border-color: var(--bad); color: var(--bad); }
.grid button.locked { opacity: .3; cursor: default; }
.grid button.star { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 10px color-mix(in srgb, var(--gold) 40%, transparent); }
.pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-height: 50vh; overflow-y: auto; padding: 4px; }
.pgrid .thumb { width: auto; height: auto; aspect-ratio: 56 / 66; }
.pgrid .thumb svg { width: 80%; height: 80%; }
.pgrid small { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-top: 3px; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); font-weight: 800; }
.toggle:last-of-type { border-bottom: 0; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.sw.on { background: var(--accent); } .sw.on::after { transform: translateX(20px); }
.skins { display: flex; gap: 8px; }
.skins button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; box-shadow: 0 0 0 1px var(--line); }
.skins button.on { border-color: var(--accent); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <section class="screen" id="home">
    <div class="top">
      <div class="pill glass" aria-label="Hints"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2zM9 20h6v2H9z"/></svg><span id="homeHints">5</span></div>
      <button class="icon glass" id="homeSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></button>
    </div>
    <div class="hero">
      <div class="orb"><svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M16 46V30h14V18h10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter"/>
        <path d="M36 10l11 8-11 8z" fill="#fff"/><path d="M22 46h16" fill="none" stroke="#fff" stroke-width="5"/><path d="M36 38l11 8-11 8z" fill="#fff"/></svg></div>
      <h1>Arrow <em>Voyage</em></h1><p>Only one can fly</p>
    </div>
    <div class="tiles">
      <button class="tile glass" id="dailyCard">
        <b>Daily<br>Challenge</b><span id="dailyDate"></span>
        <div class="art"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg></div>
        <div class="go" id="dailyGo">Start →</div>
      </button>
      <button class="tile glass alt" id="allCard">
        <b>All<br>Levels</b><span id="allSub"></span>
        <div class="art"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7M17.5 14v7"/></svg></div>
        <div class="go">Open →</div>
      </button>
    </div>
    <div class="gallery glass">
      <div class="gh"><span>Picture gallery</span><button id="galleryBtn">See all</button></div>
      <div class="strip" id="strip"></div>
    </div>
    <div class="spacer"></div>
    <div class="path" id="path"></div>
    <button class="play" id="playBtn"><b>PLAY</b><span id="playSub">Level 1</span></button>
  </section>

  <section class="screen" id="game" hidden>
    <div class="hud glass">
      <button class="icon" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="mid">
        <div class="title"><span id="lvTitle">Level 1</span><small id="foot"></small></div>
        <div class="prog"><i id="prog"></i></div>
      </div>
      <div class="cells" id="drops" aria-label="Lives"></div>
      <button class="icon" id="skinBtn" aria-label="Change colors"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></button>
      <button class="icon" id="restartBtn" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    </div>
    <div class="stage" id="stage">
      <div class="zoom" id="zoom"><div class="board" id="board"><svg id="svg"></svg><canvas id="fx"></canvas></div></div>
      <div class="banner glass" id="banner" hidden></div>
      <div class="combo" id="combo"></div>

  if (Z.pts.size === 1) { Z.moved = false; Z.drag = { start: stagePt(e), tx: Z.tx, ty: Z.ty }; Z.pinch = null; }
  if (Z.pts.size === 2) {
    const [a, b] = [...Z.pts.values()], mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    Z.pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z: Z.z, cx: (mid[0] - Z.tx) / Z.z, cy: (mid[1] - Z.ty) / Z.z };
    Z.moved = true;
  }
});
$("stage").addEventListener("pointermove", e => {
  if (!Z.pts.has(e.pointerId)) return;
  Z.pts.set(e.pointerId, stagePt(e));
  if (Z.pinch && Z.pts.size >= 2) {
    const [a, b] = [...Z.pts.values()], mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const nz = Math.min(ZMAX, Math.max(1, Z.pinch.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / Z.pinch.d));
    Z.z = nz; Z.tx = mid[0] - Z.pinch.cx * nz; Z.ty = mid[1] - Z.pinch.cy * nz;
    applyZoom(false);
  } else if (Z.drag && Z.pts.size === 1) {
    const p = Z.pts.get(e.pointerId), dx = p[0] - Z.drag.start[0], dy = p[1] - Z.drag.start[1];
    if (Math.hypot(dx, dy) > 8) Z.moved = true;
    if (Z.moved && Z.z > 1) { Z.tx = Z.drag.tx + dx; Z.ty = Z.drag.ty + dy; applyZoom(false); }
  }
});
function pointerEnd(e) {
  if (!Z.pts.has(e.pointerId)) return;
  Z.pts.delete(e.pointerId);
  if (Z.pts.size === 1 && Z.pinch) { const p = [...Z.pts.values()][0]; Z.pinch = null; Z.drag = { start: p, tx: Z.tx, ty: Z.ty }; return; }
  if (Z.pts.size === 0) {
    if (!Z.moved && e.type === "pointerup") pickAt(e.clientX, e.clientY);
    Z.drag = null; Z.pinch = null; commitZoom();
  }
}
$("stage").addEventListener("pointerup", pointerEnd);
$("stage").addEventListener("pointercancel", pointerEnd);
$("stage").addEventListener("dblclick", e => { const [px, py] = stagePt(e); zoomAt(Z.z > 1.4 ? 1 : 2.5, px, py, true); commitSoon(280); });

// pick the snake under the finger, or the nearest one within about a cell
function pickAt(clientX, clientY) {
  if (!G || !G.ready || G.done) return;
  const rect = $("board").getBoundingClientRect(), cpx = rect.width / (G.W + 2 * PAD), k = Z.z / Z.base;
  const bx = (clientX - rect.left) / cpx - PAD, by = (clientY - rect.top) / cpx - PAD;
  let best = -1, bd = 1.0;
  for (let y = Math.floor(by) - 1; y <= Math.floor(by) + 1; y++) for (let x = Math.floor(bx) - 1; x <= Math.floor(bx) + 1; x++) {
    if (x < 0 || y < 0 || x >= G.W || y >= G.H) continue;
    const o = G.owner[y * G.W + x]; if (o < 0) continue;
    const dd = Math.hypot(x + 0.5 - bx, y + 0.5 - by);
    if (dd < bd) { bd = dd; best = o; }
  }
  if (best >= 0) tap(G.snakes[best], (clientX - rect.left) / k, (clientY - rect.top) / k);
}

function blocker(s) {
  const [hx, hy] = s.cells[s.cells.length - 1], [dx, dy] = DIRS[s.d];
  for (let x = hx + dx, y = hy + dy, k = 1; x >= 0 && y >= 0 && x < G.W && y < G.H; x += dx, y += dy, k++) {
    const o = G.owner[y * G.W + x];
    if (o >= 0 && o !== s.id) return { b: G.snakes[o], k, x, y };
  }
  return null;
}

function tap(s, px, py) {
  if (!s.alive || s.busy) return;
  clearHint();
  sfx.tap();
  if (px !== undefined) { ring(px, py, css("--gold"), G.cell * 1.6); sparkle(px, py, 6, G.cell * 5); }
  const hit = blocker(s);
  if (!hit) fly(s); else bump(s, hit);
}

function fly(s) {
  const game = G;
  s.alive = false; s.busy = true;
  s.cells.forEach(([x, y]) => G.owner[y * G.W + x] = -1);
  s.el.classList.add("fly"); s.el.parentNode.appendChild(s.el);
  G.left--; $("foot").textContent = G.left ? `${G.left} left` : "Clear!";
  $("prog").style.width = (100 * (G.total - G.left) / G.total).toFixed(1) + "%";
  const now = performance.now();
  G.combo = now - G.lastFly < 1100 ? G.combo + 1 : 0; G.lastFly = now;
  sfx.whoosh(G.combo); buzz(10);
  if (G.combo >= 2) showCombo(G.combo + 1);
  const total = s.track.length - 1 - (s.cells.length - 1);
  let prev = null;
  animate(300 + total * 14, t => {
    const off = t < 0.12 ? -0.25 * Math.sin(t / 0.12 * Math.PI) : total * Math.pow((t - 0.12) / 0.88, 1.7);
    const head = drawSnake(s, off), hp = toPx(head[0], head[1]);
    if (prev && t > 0.12) { trail(prev[0], prev[1], hp[0], hp[1]); if (Math.random() < 0.5) sparkle(hp[0], hp[1], 1, G ? G.cell * 2 : 20); }
    prev = hp;
  }, () => {
    s.el.remove();
    if (G === game && !G.left && !G.done) { G.done = true; setTimeout(win, 250); }
  });
}

function bump(s, hit) {
  s.busy = true; s.el.classList.add("bad"); hit.b.el.classList.add("bad");
  const reach = hit.k - 1 + 0.35;
  let hitDone = false;
  animate(220 + hit.k * 45, t => {
    drawSnake(s, reach * Math.sin(Math.PI * t));
    if (!hitDone && t >= 0.5) {
      hitDone = true;
      const [cx, cy] = toPx(hit.x + 0.5 - DIRS[s.d][0] * 0.5, hit.y + 0.5 - DIRS[s.d][1] * 0.5);
      ring(cx, cy, css("--bad"), fx.cell * 1.8); sparkle(cx, cy, 5, fx.cell * 3, css("--bad"));
      sfx.thud(); buzz([25, 30, 25]);
      const board = $("board"); board.classList.remove("shake"); void board.offsetWidth; board.classList.add("shake");
    }
  }, () => {
    drawSnake(s, 0); s.busy = false;
    setTimeout(() => { s.el.classList.remove("bad"); hit.b.el.classList.remove("bad"); }, 250);
  });
  G.combo = 0; G.lives--;
  const lost = $("drops").children[G.lives];
  if (lost) { lost.classList.remove("pop"); lost.classList.add("fall"); }
  setTimeout(() => sfx.drop(), 140);
  if (G.lives <= 0) { G.done = true; setTimeout(lose, 700); }
}

function showCombo(k) {
  const el = $("combo"); el.textContent = `Combo ×${k}`;
  el.animate([{ opacity: 0, transform: "translate(-50%,8px) scale(.7)" }, { opacity: 1, transform: "translate(-50%,0) scale(1.15)", offset: 0.25 }, { opacity: 0, transform: "translate(-50%,-14px) scale(1)" }], { duration: 850 });
}

function clearHint() { if (G) G.snakes.forEach(s => s.el && s.el.classList.remove("hint")); }
// Ads exist only inside the Android app (window.ArrowAds from MainActivity). In a browser every call is a no-op that reports "no ad".
const Ads = (() => {
  const A = window.ArrowAds; let pending = null;
  window.__adDone = ok => { const cb = pending; pending = null; if (cb) cb(!!ok); };
  const call = f => { try { return f(); } catch (e) { return false; } };
  return {
    on: !!A,
    rewardedReady: () => !!A && call(() => A.isRewardedReady()),
    privacy: () => !!A && call(() => A.privacyOptionsRequired()),
    privacyOptions: () => A && call(() => A.showPrivacyOptions()),
    show(kind, cb) {
      if (!A || pending) return cb(false);
      pending = cb;
      if (call(() => (kind === "rewarded" ? A.showRewarded() : A.showInterstitial(), true)) === false) window.__adDone(false);
    }
  };
})();

function offerHintAd() {
  if (!Ads.rewardedReady()) { $("foot").textContent = "No hints · ad loading, try again soon"; return; }
  const o = overlay(`
    <h2>Out of hints</h2>
    <p>Watch a short video to get a free hint.</p>
    <div class="row">
      <button class="btn" id="oNo">Not now</button>
      <button class="btn primary" id="oAd">Watch ad</button>
    </div>`);
  o.querySelector("#oNo").onclick = () => { o.hidden = true; };
  o.querySelector("#oAd").onclick = () => {
    o.hidden = true;
    Ads.show("rewarded", ok => {
      if (!ok) { $("foot").textContent = "No reward this time · try again"; return; }
      save.hints++; persist(); $("hintCount").textContent = save.hints;
      $("hintBtn").onclick();
    });
  };
}

$("hintBtn").onclick = () => {
  if (!G || G.done || !G.ready) return;
  if (save.hints <= 0) { if (Ads.on) offerHintAd(); else $("foot").textContent = "No hints · 3★ a level"; return; }
  const free = G.snakes.filter(s => s.alive && !s.busy && !blocker(s));
  if (!free.length) return;
  clearHint();
  const s = free[(Math.random() * free.length) | 0];
  s.el.classList.add("hint"); s.el.parentNode.appendChild(s.el);
  const [hx, hy] = s.cells[s.cells.length - 1];
  const [cx, cy] = toPx(hx + 0.5, hy + 0.5);
  ring(cx, cy, css("--accent"), G.cell * 3); sparkle(cx, cy, 10, G.cell * 4, css("--accent"));
  sfx.hint();
  save.hints--; persist(); $("hintCount").textContent = save.hints;
};
$("restartBtn").onclick = () => G && (G.kind === "daily" ? startDaily() : startLevel(G.n));
$("backBtn").onclick = () => { G = null; renderHome(); };

function overlay(html) { const o = $("overlay"); o.innerHTML = `<div class="sheet">${html}</div>`; o.hidden = false; return o; }

function celebrate() {
  const b = $("board"), w = b.clientWidth, h = b.clientHeight;
  for (let i = 0; i < 7; i++) setTimeout(() => {
    const x = w * (0.2 + Math.random() * 0.6), y = h * (0.2 + Math.random() * 0.6);
    ring(x, y, css("--gold"), 60); sparkle(x, y, 16, 220);
  }, i * 110);
}

function win() {
  const stars = G.lives, n = G.n, daily = G.kind === "daily", shape = G.shape;
  const isPic = shape !== GRAND;
  // the picture lights up first, then the result sheet
  $("sil").classList.add("reveal"); sfx.reveal(); buzz([30, 40, 60]); celebrate();
  let extra = "", adBreak = false;
  if (daily) { if (save.daily !== G.key) { save.hints += 2; extra = " · +2 hints"; } save.daily = G.key; }
  else {
    const isNew = (save.stars[n] || 0) < 3 && stars === 3;
    save.stars[n] = Math.max(save.stars[n] || 0, stars);
    if (isNew) { save.hints++; extra = " · +1 hint"; }
    save.unlocked = Math.max(save.unlocked, n + 1);
    // ad break on every 3rd win after level 15 (first one at level 18 when playing in order)
    if (n > 15) { save.adWins = (save.adWins || 0) + 1; adBreak = Ads.on && save.adWins % 3 === 0; }
  }
  const newPic = isPic && !save.pics[shape.name];
  if (isPic) save.pics[shape.name] = true;
  persist();
  const last = !daily && n >= LEVELS;
  const msg = stars === 3 ? "Flawless! Not a single miss." : stars === 2 ? "Great! Just one slip." : "Made it on the last cell!";
  setTimeout(() => {
    sfx.win();
    const o = overlay(`
      <div class="stars">${[1, 2, 3].map(i => STAR.replace("<svg", `<svg class="${i <= stars ? "on" : ""}"`)).join("")}</div>
      ${isPic ? `<div class="pic" style="color:var(--gold)">${picSvg(shape)}</div>` : ""}
      <h2>${isPic ? shape.name + (newPic ? " revealed!" : "!") : daily ? "Daily cleared!" : last ? "All levels done!" : "Maze cleared!"}</h2>
      <p>${msg}${extra}${newPic ? " · New picture in your gallery" : ""}</p>
      <div class="row">
        <button class="btn" id="oRetry">${daily ? "Home" : "Replay"}</button>
        <button class="btn primary" id="oNext">${daily || last ? "Home" : "Next level"}</button>
      </div>`);
    const after = f => () => { if (!adBreak) return f(); adBreak = false; o.hidden = true; Ads.show("interstitial", f); };
    o.querySelector("#oRetry").onclick = after(() => daily ? (G = null, renderHome()) : startLevel(n));
    o.querySelector("#oNext").onclick = after(() => daily || last ? (G = null, renderHome()) : startLevel(n + 1));
  }, 1100);
}

function lose() {
  sfx.lose(); buzz(90);
  const meta = { kind: G.kind, n: G.n };
  const o = overlay(`
    <h2>Out of energy!</h2>
    <p>Only an arrow with nothing in front of its head can fly. Look for the one everyone else is waiting on.</p>
    <div class="row">
      <button class="btn" id="oHome">Home</button>
      <button class="btn primary" id="oRetry">Try again</button>
    </div>`);
  o.querySelector("#oRetry").onclick = () => meta.kind === "daily" ? startDaily() : startLevel(meta.n);
  o.querySelector("#oHome").onclick = () => { G = null; renderHome(); };
}

renderHome();
</script>
</body></html>
